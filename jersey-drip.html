<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jersey Drip — Premium Resale</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --gold-pale: #F5E6B8;
    --black: #0A0A0A;
    --dark: #111111;
    --dark2: #1A1A1A;
    --dark3: #222222;
    --white: #F9F5EC;
    --gray: #888;
    --red: #C0392B;
    --green: #27AE60;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,10,0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(201,168,76,0.25);
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    height: 70px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 4px;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,168,76,0.4);
  }

  .logo span { color: var(--white); }

  nav { display: flex; gap: 32px; align-items: center; }

  nav a {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gray);
    text-decoration: none;
    transition: color 0.2s;
    cursor: pointer;
  }

  nav a:hover, nav a.active { color: var(--gold); }

  .add-btn {
    background: var(--gold);
    color: var(--black);
    border: none;
    padding: 10px 22px;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 700;
  }

  .add-btn:hover { background: var(--gold-light); transform: translateY(-1px); }

  /* ── HERO ── */
  .hero {
    padding: 80px 40px 60px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: 'JERSEY DRIP';
    position: absolute;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18vw;
    color: rgba(201,168,76,0.04);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    pointer-events: none;
    letter-spacing: 10px;
  }

  .hero-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 5px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 7vw, 6rem);
    letter-spacing: 3px;
    line-height: 0.9;
    color: var(--white);
  }

  .hero h1 em {
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    color: var(--gold);
  }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex; gap: 0;
    margin: 50px 40px;
    border: 1px solid rgba(201,168,76,0.2);
  }

  .stat {
    flex: 1;
    padding: 24px 32px;
    border-right: 1px solid rgba(201,168,76,0.2);
    position: relative;
  }

  .stat:last-child { border-right: none; }

  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    color: var(--gold);
    letter-spacing: 2px;
    display: block;
  }

  .stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 3px;
    color: var(--gray);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ── FILTERS ── */
  .filters {
    padding: 0 40px 32px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--gray);
    padding: 8px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.05);
  }

  .category-select {
    background: var(--dark2);
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold);
    padding: 8px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    outline: none;
    transition: all 0.2s;
  }

  .category-select:hover, .category-select:focus {
    border-color: var(--gold);
    background: rgba(201,168,76,0.05);
  }

  .search-wrap {
    margin-left: auto;
    position: relative;
  }

  .search-wrap input {
    background: var(--dark2);
    border: 1px solid rgba(201,168,76,0.2);
    color: var(--white);
    padding: 8px 36px 8px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 1px;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--gold); }

  .search-wrap input::placeholder { color: var(--gray); }

  .search-icon {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--gray); font-size: 0.7rem; pointer-events: none;
  }

  /* ── GRID ── */
  .catalog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 2px;
    padding: 0 40px 80px;
  }

  /* ── CARD ── */
  .jersey-card {
    background: var(--dark2);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s;
    border: 1px solid transparent;
  }

  .jersey-card:hover {
    border-color: rgba(201,168,76,0.3);
    transform: translateY(-3px);
    z-index: 2;
  }

  .card-img {
    width: 100%; height: 260px;
    background: var(--dark3);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .card-img-placeholder {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 5rem;
    color: rgba(201,168,76,0.12);
    letter-spacing: 2px;
    user-select: none;
  }

  .badge-status {
    position: absolute; top: 12px; left: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 0.5rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 10px;
    font-weight: 700;
  }

  .badge-available { background: rgba(39,174,96,0.15); color: var(--green); border: 1px solid var(--green); }
  .badge-sold { background: rgba(192,57,43,0.15); color: var(--red); border: 1px solid var(--red); }
  .badge-reserved { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid var(--gold); }

  .card-actions {
    position: absolute; top: 12px; right: 12px;
    display: flex; gap: 6px; opacity: 0;
    transition: opacity 0.2s;
  }

  .jersey-card:hover .card-actions { opacity: 1; }

  .action-btn {
    width: 30px; height: 30px;
    background: rgba(10,10,10,0.85);
    border: 1px solid rgba(201,168,76,0.4);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 0.75rem;
    transition: all 0.15s;
  }

  .action-btn:hover { background: var(--gold); color: var(--black); }

  .action-btn.del:hover { background: var(--red); border-color: var(--red); color: #fff; }

  .card-body { padding: 18px 20px 20px; }

  .card-club {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 5px;
  }

  .card-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 1px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .card-meta {
    font-size: 0.8rem;
    color: var(--gray);
    font-style: italic;
    margin-bottom: 14px;
  }

  .card-footer {
    display: flex; align-items: flex-end; justify-content: space-between;
  }

  .card-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--gold);
    letter-spacing: 1px;
    line-height: 1;
  }

  .card-price-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.45rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
    display: block;
    margin-bottom: 2px;
  }

  .card-size {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    color: var(--gray);
    background: var(--dark3);
    padding: 5px 10px;
    border: 1px solid var(--dark3);
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 100px 40px;
    color: var(--gray);
  }

  .empty-state .big-icon {
    font-size: 4rem;
    margin-bottom: 20px;
    opacity: 0.3;
  }

  .empty-state p {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--dark2);
    border: 1px solid rgba(201,168,76,0.3);
    width: 90%; max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(20px);
    transition: transform 0.25s;
    padding: 40px;
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 3px;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .modal-sub {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 32px;
  }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-full { grid-column: 1 / -1; }

  .form-group { display: flex; flex-direction: column; gap: 6px; }

  .form-group label {
    font-family: 'Space Mono', monospace;
    font-size: 0.5rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    background: var(--dark3);
    border: 1px solid rgba(201,168,76,0.2);
    color: var(--white);
    padding: 10px 14px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--gold); }

  .form-group select option { background: var(--dark3); }
  .form-group textarea { resize: vertical; min-height: 70px; }

  .modal-footer {
    display: flex; justify-content: flex-end; gap: 12px;
    margin-top: 28px;
  }

  .btn-cancel {
    background: transparent;
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gray);
    padding: 10px 24px;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-cancel:hover { border-color: var(--gray); color: var(--white); }

  .btn-save {
    background: var(--gold);
    border: none;
    color: var(--black);
    padding: 10px 28px;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s;
  }

  .btn-save:hover { background: var(--gold-light); }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 30px; right: 30px; z-index: 300;
    background: var(--dark2);
    border-left: 3px solid var(--gold);
    padding: 14px 24px;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--white);
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--black); }
  ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); }

  @media (max-width: 600px) {
    header { padding: 0 20px; }
    .hero, .filters, .stats-bar { padding-left: 20px; padding-right: 20px; }
    .stats-bar { margin: 30px 20px; flex-wrap: wrap; }
    .catalog-grid { padding: 0 20px 60px; }
    .form-grid { grid-template-columns: 1fr; }
    nav { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Jersey<span>Drip</span></div>
  <nav>
    <a class="active" onclick="setView('catalog')">Catalog</a>
    <a onclick="setView('inventory')">Inventory</a>
  </nav>
  <div style="display:flex; align-items:center; gap:16px;">
    <img src="JD__1_.png" alt="Jersey Drip Logo" style="height:48px; width:48px; object-fit:contain; border-radius:50%;">
    <button class="add-btn" onclick="openModal()">+ Add Jersey</button>
  </div>
</header>

<section class="hero">
  <p class="hero-label">Premium Football Resale</p>
  <h1>The Drop<br><em>is Real.</em></h1>
</section>

<div class="stats-bar" id="statsBar">
  <div class="stat"><span class="stat-val" id="statTotal">0</span><span class="stat-label">Total Jerseys</span></div>
  <div class="stat"><span class="stat-val" id="statAvail">0</span><span class="stat-label">Available</span></div>
  <div class="stat"><span class="stat-val" id="statSold">0</span><span class="stat-label">Sold</span></div>
  <div class="stat"><span class="stat-val" id="statValue">€0</span><span class="stat-label">Total Value</span></div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('available', this)">Available</button>
  <button class="filter-btn" onclick="setFilter('reserved', this)">Reserved</button>
  <button class="filter-btn" onclick="setFilter('sold', this)">Sold</button>
  <select class="category-select" id="categorySelect" onchange="setCategory(this.value)">
    <option value="all">— Categoria —</option>
    <option value="nazionali">Nazionali</option>
  </select>
  <select class="category-select" id="subCategorySelect" onchange="setSubCategory(this.value)" style="display:none">
    <option value="all">— Paese —</option>
    <option value="argentina">Argentina</option>
    <option value="brasile">Brasile</option>
  </select>
  <div class="search-wrap">
    <input type="text" placeholder="Search jerseys..." id="searchInput" oninput="renderCatalog()">
    <span class="search-icon">🔍</span>
  </div>
</div>

<div class="catalog-grid" id="catalogGrid"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Add Jersey</div>
    <div class="modal-sub" id="modalSub">New item to the catalog</div>
    <div class="form-grid">
      <div class="form-group form-full">
        <label>Categoria</label>
        <select id="fCategory" onchange="toggleSubCategoryField(this.value)">
          <option value="nazionali">Nazionali</option>
        </select>
      </div>
      <div class="form-group form-full" id="subCategoryField">
        <label>Paese</label>
        <select id="fSubCategory">
          <option value="">— Seleziona paese —</option>
          <option value="argentina">Argentina</option>
          <option value="brasile">Brasile</option>
        </select>
      </div>
      <div class="form-group">
        <label>Club / Team</label>
        <input type="text" id="fClub" placeholder="e.g. AC Milan">
      </div>
      <div class="form-group">
        <label>Season / Year</label>
        <input type="text" id="fSeason" placeholder="e.g. 2006-07">
      </div>
      <div class="form-group form-full">
        <label>Jersey Name / Description</label>
        <input type="text" id="fName" placeholder="e.g. Home Kit — Kaka #22">
      </div>
      <div class="form-group">
        <label>Size</label>
        <select id="fSize">
          <option value="">— Select —</option>
          <option>XS</option><option>S</option><option>M</option>
          <option>L</option><option>XL</option><option>XXL</option>
          <option>Youth L</option><option>Youth M</option>
        </select>
      </div>
      <div class="form-group">
        <label>Condition</label>
        <select id="fCondition">
          <option value="">— Select —</option>
          <option>Mint / BNWT</option>
          <option>Excellent</option>
          <option>Good</option>
          <option>Fair</option>
        </select>
      </div>
      <div class="form-group">
        <label>Asking Price (€)</label>
        <input type="number" id="fPrice" placeholder="e.g. 120" min="0">
      </div>
      <div class="form-group">
        <label>Buy Price (€)</label>
        <input type="number" id="fBuyPrice" placeholder="e.g. 60" min="0">
      </div>
      <div class="form-group form-full">
        <label>Status</label>
        <select id="fStatus">
          <option value="available">Available</option>
          <option value="reserved">Reserved</option>
          <option value="sold">Sold</option>
        </select>
      </div>
      <div class="form-group form-full">
        <label>Notes</label>
        <textarea id="fNotes" placeholder="Player patch, match worn, authentication details..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveJersey()">Save Jersey</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'jerseydrip_v4';
  let jerseys = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

  if (!jerseys.length) {
    jerseys = [
      {
        id: 1,
        category: 'nazionali',
        subCategory: 'argentina',
        club: 'Argentina',
        season: '2022',
        name: 'Home Kit — World Cup 2022',
        size: 'S / M / L / XL / XXL',
        condition: 'Mint / BNWT',
        price: 34.99,
        buyPrice: 0,
        status: 'available',
        notes: 'Nuova con cartellino',
        imgFront: 'argentina-front.jpg',
        imgBack: 'argentina-back.webp'
      }
    ];
    save();
  }
  let editingId = null;
  let currentFilter = 'all';
  let currentCategory = 'all';
  let currentSubCategory = 'all';

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(jerseys));
  }

  function nextId() {
    return jerseys.length ? Math.max(...jerseys.map(j => j.id)) + 1 : 1;
  }

  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderCatalog();
  }

  function setCategory(val) {
    currentCategory = val;
    currentSubCategory = 'all';
    const sub = document.getElementById('subCategorySelect');
    if (val === 'nazionali') {
      sub.style.display = '';
      sub.value = 'all';
    } else {
      sub.style.display = 'none';
    }
    renderCatalog();
  }

  function setSubCategory(val) {
    currentSubCategory = val;
    renderCatalog();
  }

  function setView(v) {
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    event.target.classList.add('active');
    renderCatalog();
  }

  function getFiltered() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    return jerseys.filter(j => {
      const matchFilter = currentFilter === 'all' || j.status === currentFilter;
      const matchCategory = currentCategory === 'all' || j.category === currentCategory || (currentCategory === 'nazionali' && ['argentina','brasile'].includes(j.subCategory));
      const matchSubCategory = currentSubCategory === 'all' || j.subCategory === currentSubCategory;
      const matchSearch = !q || [j.club, j.name, j.season, j.size].some(f => f && f.toLowerCase().includes(q));
      return matchFilter && matchCategory && matchSubCategory && matchSearch;
    });
  }

  function updateStats() {
    const avail = jerseys.filter(j => j.status === 'available');
    const sold = jerseys.filter(j => j.status === 'sold');
    const totalVal = avail.reduce((s, j) => s + (parseFloat(j.price) || 0), 0);
    document.getElementById('statTotal').textContent = jerseys.length;
    document.getElementById('statAvail').textContent = avail.length;
    document.getElementById('statSold').textContent = sold.length;
    document.getElementById('statValue').textContent = '€' + totalVal.toLocaleString('it-IT');
  }

  function statusBadge(s) {
    const map = { available: 'badge-available', reserved: 'badge-reserved', sold: 'badge-sold' };
    const labels = { available: 'Available', reserved: 'Reserved', sold: 'Sold' };
    return `<div class="badge-status ${map[s]}">${labels[s]}</div>`;
  }

  function initials(club) {
    return club ? club.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 3) : '?';
  }

  function renderCatalog() {
    const grid = document.getElementById('catalogGrid');
    const list = getFiltered();
    updateStats();

    if (!list.length) {
      grid.innerHTML = `<div class="empty-state"><div class="big-icon">👕</div><p>No jerseys found</p><button class="add-btn" onclick="openModal()">+ Add First Jersey</button></div>`;
      return;
    }

    grid.innerHTML = list.map(j => {
      const margin = j.buyPrice && j.price ? ((j.price - j.buyPrice) / j.buyPrice * 100).toFixed(0) : null;
      const imgFront = j.imgFront ? `<img src="${j.imgFront}" style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;transition:opacity 0.4s;" class="img-front">` : '';
      const imgBack = j.imgBack ? `<img src="${j.imgBack}" style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;opacity:0;transition:opacity 0.4s;" class="img-back">` : '';
      const placeholder = (!j.imgFront) ? `<div class="card-img-placeholder">${initials(j.club)}</div>` : '';
      return `
      <div class="jersey-card" onclick="openEdit(${j.id})" onmouseenter="flipCard(this, true)" onmouseleave="flipCard(this, false)">
        <div class="card-img" style="position:relative;">
          ${placeholder}${imgFront}${imgBack}
          ${statusBadge(j.status)}
          <div class="card-actions" onclick="event.stopPropagation()">
            <div class="action-btn" onclick="openEdit(${j.id})" title="Edit">✎</div>
            <div class="action-btn del" onclick="deleteJersey(${j.id})" title="Delete">✕</div>
          </div>
        </div>
        <div class="card-body">
          <div class="card-club">${j.subCategory ? j.subCategory.toUpperCase() : (j.category ? j.category.toUpperCase() : '')} · ${j.season || '—'}</div>
          <div class="card-name">${j.name || 'Untitled Jersey'}</div>
          <div class="card-meta">${j.condition || ''}${j.notes ? ' · ' + j.notes.slice(0,40) + (j.notes.length > 40 ? '…' : '') : ''}</div>
          <div class="card-footer">
            <div>
              <span class="card-price-label">Prezzo</span>
              <div class="card-price">€${parseFloat(j.price || 0).toLocaleString('it-IT', {minimumFractionDigits:2})}</div>
            </div>
            <div class="card-size">${j.size || '—'}</div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function flipCard(card, show) {
    const front = card.querySelector('.img-front');
    const back = card.querySelector('.img-back');
    if (front && back) {
      front.style.opacity = show ? '0' : '1';
      back.style.opacity = show ? '1' : '0';
    }
  }

  function openModal(id = null) {
    editingId = id;
    const modal = document.getElementById('modalOverlay');
    const j = id ? jerseys.find(x => x.id === id) : null;
    document.getElementById('modalTitle').textContent = id ? 'Edit Jersey' : 'Add Jersey';
    document.getElementById('modalSub').textContent = id ? 'Update item details' : 'New item to the catalog';
    document.getElementById('fCategory').value = j?.category || 'nazionali';
    document.getElementById('fSubCategory').value = j?.subCategory || '';
    toggleSubCategoryField(j?.category || 'nazionali');
    document.getElementById('fClub').value = j?.club || '';
    document.getElementById('fSeason').value = j?.season || '';
    document.getElementById('fName').value = j?.name || '';
    document.getElementById('fSize').value = j?.size || '';
    document.getElementById('fCondition').value = j?.condition || '';
    document.getElementById('fPrice').value = j?.price || '';
    document.getElementById('fBuyPrice').value = j?.buyPrice || '';
    document.getElementById('fStatus').value = j?.status || 'available';
    document.getElementById('fNotes').value = j?.notes || '';
    modal.classList.add('open');
  }

  function openEdit(id) { openModal(id); }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
  }

  function closeModalOutside(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  function toggleSubCategoryField(val) {
    document.getElementById('subCategoryField').style.display = val === 'nazionali' ? '' : 'none';
  }

  function saveJersey() {
    const data = {
      category: document.getElementById('fCategory').value,
      subCategory: document.getElementById('fSubCategory').value,
      club: document.getElementById('fClub').value.trim(),
      season: document.getElementById('fSeason').value.trim(),
      name: document.getElementById('fName').value.trim(),
      size: document.getElementById('fSize').value,
      condition: document.getElementById('fCondition').value,
      price: parseFloat(document.getElementById('fPrice').value) || 0,
      buyPrice: parseFloat(document.getElementById('fBuyPrice').value) || 0,
      status: document.getElementById('fStatus').value,
      notes: document.getElementById('fNotes').value.trim(),
    };

    if (!data.club || !data.name) { showToast('Club and name are required'); return; }

    if (editingId) {
      const idx = jerseys.findIndex(j => j.id === editingId);
      jerseys[idx] = { ...jerseys[idx], ...data };
      showToast('Jersey updated ✓');
    } else {
      jerseys.unshift({ id: nextId(), ...data });
      showToast('Jersey added ✓');
    }

    save();
    closeModal();
    renderCatalog();
  }

  function deleteJersey(id) {
    if (!confirm('Delete this jersey?')) return;
    jerseys = jerseys.filter(j => j.id !== id);
    save();
    renderCatalog();
    showToast('Jersey removed');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // init
  renderCatalog();
</script>
</body>
</html>
