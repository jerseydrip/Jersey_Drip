<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jersey Drip — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --gold:#C9A84C; --gold-light:#E8C96A; --black:#0A0A0A; --dark:#111111; --dark2:#1A1A1A; --dark3:#222222; --white:#F9F5EC; --gray:#888; --red:#C0392B; --green:#27AE60; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--black); color:var(--white); font-family:'Cormorant Garamond',serif; min-height:100vh; }
  header { background:rgba(10,10,10,0.96); border-bottom:1px solid rgba(201,168,76,0.25); padding:0 40px; display:flex; align-items:center; justify-content:space-between; height:70px; }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:4px; color:var(--gold); }
  .logo span { color:var(--white); }
  .admin-badge { font-family:'Space Mono',monospace; font-size:0.55rem; letter-spacing:3px; text-transform:uppercase; background:rgba(201,168,76,0.15); color:var(--gold); border:1px solid rgba(201,168,76,0.3); padding:6px 14px; }
  .add-btn { background:var(--gold); color:var(--black); border:none; padding:10px 22px; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:2px; text-transform:uppercase; cursor:pointer; font-weight:700; transition:all 0.2s; }
  .add-btn:hover { background:var(--gold-light); }
  .stats-bar { display:flex; margin:40px 40px 20px; border:1px solid rgba(201,168,76,0.2); }
  .stat { flex:1; padding:20px 28px; border-right:1px solid rgba(201,168,76,0.2); }
  .stat:last-child { border-right:none; }
  .stat-val { font-family:'Bebas Neue',sans-serif; font-size:2.2rem; color:var(--gold); display:block; }
  .stat-label { font-family:'Space Mono',monospace; font-size:0.5rem; letter-spacing:3px; color:var(--gray); text-transform:uppercase; }
  .toolbar { padding:0 40px 24px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .filter-btn { background:transparent; border:1px solid rgba(201,168,76,0.25); color:var(--gray); padding:7px 18px; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all 0.2s; }
  .filter-btn.active, .filter-btn:hover { border-color:var(--gold); color:var(--gold); background:rgba(201,168,76,0.05); }
  .search-wrap { margin-left:auto; position:relative; }
  .search-wrap input { background:var(--dark2); border:1px solid rgba(201,168,76,0.2); color:var(--white); padding:8px 16px; font-family:'Space Mono',monospace; font-size:0.6rem; width:220px; outline:none; }
  .search-wrap input:focus { border-color:var(--gold); }
  .search-wrap input::placeholder { color:var(--gray); }
  .table-wrap { padding:0 40px 80px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th { font-family:'Space Mono',monospace; font-size:0.5rem; letter-spacing:3px; text-transform:uppercase; color:var(--gold); padding:12px 16px; text-align:left; border-bottom:1px solid rgba(201,168,76,0.2); }
  td { padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.04); font-size:0.9rem; vertical-align:middle; }
  tr:hover td { background:rgba(201,168,76,0.03); }
  .td-img { width:50px; height:50px; object-fit:cover; }
  .td-name { font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:1px; }
  .td-meta { font-family:'Space Mono',monospace; font-size:0.5rem; letter-spacing:2px; color:var(--gray); text-transform:uppercase; }
  .td-price { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; color:var(--gold); }
  .badge-status { font-family:'Space Mono',monospace; font-size:0.45rem; letter-spacing:2px; text-transform:uppercase; padding:3px 8px; font-weight:700; }
  .badge-available { background:rgba(39,174,96,0.15); color:var(--green); border:1px solid var(--green); }
  .badge-sold { background:rgba(192,57,43,0.15); color:var(--red); border:1px solid var(--red); }
  .badge-reserved { background:rgba(201,168,76,0.15); color:var(--gold); border:1px solid var(--gold); }
  .action-btn { width:28px; height:28px; background:var(--dark3); border:1px solid rgba(201,168,76,0.3); color:var(--gold); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:0.7rem; transition:all 0.15s; margin-right:4px; }
  .action-btn:hover { background:var(--gold); color:var(--black); }
  .action-btn.del:hover { background:var(--red); border-color:var(--red); color:#fff; }
  .modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.25s; }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal { background:var(--dark2); border:1px solid rgba(201,168,76,0.3); width:90%; max-width:520px; max-height:90vh; overflow-y:auto; padding:40px; }
  .modal-title { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:3px; color:var(--gold); margin-bottom:24px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .form-full { grid-column:1/-1; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  .form-group label { font-family:'Space Mono',monospace; font-size:0.5rem; letter-spacing:3px; text-transform:uppercase; color:var(--gold); }
  .form-group input, .form-group select, .form-group textarea { background:var(--dark3); border:1px solid rgba(201,168,76,0.2); color:var(--white); padding:10px 14px; font-family:'Cormorant Garamond',serif; font-size:1rem; outline:none; width:100%; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--gold); }
  .form-group select option { background:var(--dark3); }
  .form-group textarea { resize:vertical; min-height:60px; }
  .modal-footer { display:flex; justify-content:flex-end; gap:12px; margin-top:24px; }
  .btn-cancel { background:transparent; border:1px solid rgba(201,168,76,0.3); color:var(--gray); padding:10px 24px; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:2px; text-transform:uppercase; cursor:pointer; }
  .btn-save { background:var(--gold); border:none; color:var(--black); padding:10px 28px; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:2px; text-transform:uppercase; cursor:pointer; font-weight:700; }
  .btn-save:hover { background:var(--gold-light); }
  .toast { position:fixed; bottom:30px; right:30px; z-index:300; background:var(--dark2); border-left:3px solid var(--gold); padding:14px 24px; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:2px; text-transform:uppercase; color:var(--white); opacity:0; transform:translateY(10px); transition:all 0.3s; pointer-events:none; }
  .toast.show { opacity:1; transform:translateY(0); }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:var(--black); }
  ::-webkit-scrollbar-thumb { background:rgba(201,168,76,0.3); }
</style>
</head>
<body>

<header>
  <div class="logo">Jersey<span>Drip</span></div>
  <div class="admin-badge">Pannello Admin</div>
  <button class="add-btn" onclick="openModal()">+ Aggiungi Maglia</button>
</header>

<div class="stats-bar">
  <div class="stat"><span class="stat-val" id="statTotal">0</span><span class="stat-label">Totale</span></div>
  <div class="stat"><span class="stat-val" id="statAvail">0</span><span class="stat-label">Disponibili</span></div>
  <div class="stat"><span class="stat-val" id="statSold">0</span><span class="stat-label">Vendute</span></div>
  <div class="stat"><span class="stat-val" id="statValue">€0</span><span class="stat-label">Valore stock</span></div>
</div>

<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('all',this)">Tutte</button>
  <button class="filter-btn" onclick="setFilter('available',this)">Disponibili</button>
  <button class="filter-btn" onclick="setFilter('reserved',this)">Prenotate</button>
  <button class="filter-btn" onclick="setFilter('sold',this)">Vendute</button>
  <div class="search-wrap">
    <input type="text" placeholder="Cerca..." id="searchInput" oninput="renderTable()">
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Foto</th>
        <th>Maglia</th>
        <th>Categoria</th>
        <th>Taglia</th>
        <th>Condizione</th>
        <th>Prezzo</th>
        <th>Status</th>
        <th>Azioni</th>
      </tr>
    </thead>
    <tbody id="jerseyTable"></tbody>
  </table>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Aggiungi Maglia</div>
    <div class="form-grid">
      <div class="form-group form-full">
        <label>Categoria</label>
        <select id="fCategory" onchange="toggleSubCategoryField(this.value)">
          <option value="nazionali">Nazionali</option>
        </select>
      </div>
      <div class="form-group form-full" id="subCategoryField">
        <label>Paese</label>
        <select id="fSubCategory">
          <option value="">— Seleziona —</option>
          <option value="argentina">Argentina</option>
          <option value="belgio">Belgio</option>
          <option value="brasile">Brasile</option>
          <option value="francia">Francia</option>
          <option value="germania">Germania</option>
          <option value="inghilterra">Inghilterra</option>
          <option value="spagna">Spagna</option>
        </select>
      </div>
      <div class="form-group"><label>Club / Nazione</label><input type="text" id="fClub" placeholder="es. Argentina"></div>
      <div class="form-group"><label>Stagione / Anno</label><input type="text" id="fSeason" placeholder="es. 2026"></div>
      <div class="form-group form-full"><label>Nome Maglia</label><input type="text" id="fName" placeholder="es. Home Kit — World Cup 2026"></div>
      <div class="form-group"><label>Prezzo (€)</label><input type="number" id="fPrice" placeholder="34.99" min="0"></div>
      <div class="form-group"><label>Prezzo acquisto (€)</label><input type="number" id="fBuyPrice" placeholder="0" min="0"></div>
      <div class="form-group"><label>Condizione</label>
        <select id="fCondition">
          <option>Mint / BNWT</option><option>Excellent</option><option>Good</option><option>Fair</option>
        </select>
      </div>
      <div class="form-group"><label>Status</label>
        <select id="fStatus">
          <option value="available">Disponibile</option>
          <option value="reserved">Prenotata</option>
          <option value="sold">Venduta</option>
        </select>
      </div>
      <div class="form-group form-full"><label>Foto fronte (nome file)</label><input type="text" id="fImgFront" placeholder="es. argentina-front.jpg"></div>
      <div class="form-group form-full"><label>Foto retro (nome file)</label><input type="text" id="fImgBack" placeholder="es. argentina-back.jpg"></div>
      <div class="form-group form-full"><label>Note</label><textarea id="fNotes" placeholder="Dettagli aggiuntivi..."></textarea></div>
      <div class="form-group" style="border-top:1px solid rgba(201,168,76,0.15);padding-top:16px;grid-column:1/-1;">
        <label style="color:var(--gold-light);">Personalizzazione gratuita</label>
      </div>
      <div class="form-group"><label>Nome sulla maglia</label><input type="text" id="fCustomName" placeholder="es. MESSI"></div>
      <div class="form-group"><label>Numero sulla maglia</label><input type="text" id="fCustomNumber" placeholder="es. 10"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Annulla</button>
      <button class="btn-save" onclick="saveJersey()">Salva</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'jerseydrip_v7';
  let jerseys = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let editingId = null;
  let currentFilter = 'all';

  if (!jerseys.length) {
    const base = { category:'nazionali', size:'S/M/L/XL/XXL', condition:'Mint / BNWT', price:34.99, buyPrice:0, status:'available', notes:'Nuova con cartellino' };
    jerseys = [
      { ...base, id:1, subCategory:'argentina', club:'Argentina', season:'2026', name:'Home Kit — World Cup 2026', imgFront:'argentina-front.jpg', imgBack:'argentina-back.webp' },
      { ...base, id:2, subCategory:'argentina', club:'Argentina', season:'2026', name:'Away Kit — World Cup 2026', imgFront:'argentina-away-front.jpg', imgBack:'argentina-away-back.jpg' },
      { ...base, id:3, subCategory:'brasile', club:'Brasile', season:'2026', name:'Home Kit — World Cup 2026', imgFront:'brasile-home-front.jpg', imgBack:'brasile-home-back.jpg' },
      { ...base, id:4, subCategory:'brasile', club:'Brasile', season:'2026', name:'Away Kit — World Cup 2026', imgFront:'brasile-away-front.jpg', imgBack:'brasile-away-back.jpg' },
      { ...base, id:5, subCategory:'spagna', club:'Spagna', season:'2026', name:'Home Kit — World Cup 2026', imgFront:'spagna-home-front.jpg', imgBack:'spagna-home-back.jpg' },
      { ...base, id:6, subCategory:'spagna', club:'Spagna', season:'2026', name:'Away Kit — World Cup 2026', imgFront:'spagna-away-front.jpg', imgBack:'spagna-away-back.jpg' },
      { ...base, id:7, subCategory:'francia', club:'Francia', season:'2026', name:'Home Kit — World Cup 2026', imgFront:'francia-home-front.jpg', imgBack:'francia-home-back.jpg' },
      { ...base, id:8, subCategory:'francia', club:'Francia', season:'2026', name:'Away Kit — World Cup 2026', imgFront:'francia-away-front.jpg', imgBack:'francia-away-back.jpg' },
      { ...base, id:9, subCategory:'belgio', club:'Belgio', season:'2026', name:'Home Kit — World Cup 2026', imgFront:'belgio-home-front.jpg', imgBack:'belgio-home-back.jpg' },
      { ...base, id:10, subCategory:'belgio', club:'Belgio', season:'2026', name:'Away Kit — World Cup 2026', imgFront:'belgio-away-front.jpg', imgBack:'belgio-away-back.jpg' },
      { ...base, id:11, subCategory:'inghilterra', club:'Inghilterra', season:'2026', name:'Home Kit — World Cup 2026', imgFront:'inghilterra-home-front.jpg', imgBack:'inghilterra-home-back.jpg' },
      { ...base, id:12, subCategory:'inghilterra', club:'Inghilterra', season:'2026', name:'Away Kit — World Cup 2026', imgFront:'inghilterra-away-front.jpg', imgBack:'inghilterra-away-back.jpg' },
      { ...base, id:13, subCategory:'germania', club:'Germania', season:'2026', name:'Home Kit — World Cup 2026', imgFront:'germania-home-front.jpg', imgBack:'germania-home-back.jpg' },
      { ...base, id:14, subCategory:'germania', club:'Germania', season:'2026', name:'Away Kit — World Cup 2026', imgFront:'germania-away-front.jpg', imgBack:'germania-away-back.jpg' },
    ];
    save();
  }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(jerseys)); }
  function nextId() { return jerseys.length ? Math.max(...jerseys.map(j=>j.id))+1 : 1; }

  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderTable();
  }

  function getFiltered() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    return jerseys.filter(j => {
      const matchFilter = currentFilter === 'all' || j.status === currentFilter;
      const matchSearch = !q || [j.club, j.name, j.season, j.subCategory].some(f => f && f.toLowerCase().includes(q));
      return matchFilter && matchSearch;
    });
  }

  function updateStats() {
    const avail = jerseys.filter(j => j.status === 'available');
    const sold = jerseys.filter(j => j.status === 'sold');
    const val = avail.reduce((s,j) => s + (parseFloat(j.price)||0), 0);
    document.getElementById('statTotal').textContent = jerseys.length;
    document.getElementById('statAvail').textContent = avail.length;
    document.getElementById('statSold').textContent = sold.length;
    document.getElementById('statValue').textContent = '€' + val.toLocaleString('it-IT',{minimumFractionDigits:2});
  }

  function statusBadge(s) {
    const map = { available:'badge-available', reserved:'badge-reserved', sold:'badge-sold' };
    const labels = { available:'Disponibile', reserved:'Prenotata', sold:'Venduta' };
    return `<span class="badge-status ${map[s]}">${labels[s]}</span>`;
  }

  function renderTable() {
    const list = getFiltered();
    updateStats();
    const tbody = document.getElementById('jerseyTable');
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:60px;color:var(--gray);font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:2px;">NESSUNA MAGLIA</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(j => `
      <tr>
        <td>${j.imgFront ? `<img class="td-img" src="${j.imgFront}">` : `<div class="td-img" style="background:var(--dark3);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;color:rgba(201,168,76,0.2);">${(j.club||'').slice(0,2).toUpperCase()}</div>`}</td>
        <td><div class="td-name">${j.name||'—'}</div><div class="td-meta">${j.subCategory||''} · ${j.season||''}${j.customName||j.customNumber ? ' · ✎ '+[j.customName,j.customNumber].filter(Boolean).join(' #') : ''}</div></td>
        <td><div class="td-meta">${j.category||'—'}</div></td>
        <td><div class="td-meta">S/M/L/XL/XXL</div></td>
        <td><div class="td-meta">${j.condition||'—'}</div></td>
        <td><div class="td-price">€${parseFloat(j.price||0).toLocaleString('it-IT',{minimumFractionDigits:2})}</div>${j.buyPrice ? `<div class="td-meta">Acquisto: €${parseFloat(j.buyPrice).toLocaleString('it-IT',{minimumFractionDigits:2})}</div>` : ''}</td>
        <td>${statusBadge(j.status)}</td>
        <td>
          <div class="action-btn" onclick="openEdit(${j.id})" title="Modifica">✎</div>
          <div class="action-btn del" onclick="deleteJersey(${j.id})" title="Elimina">✕</div>
        </td>
      </tr>`).join('');
  }

  function openModal(id=null) {
    editingId = id;
    const j = id ? jerseys.find(x=>x.id===id) : null;
    document.getElementById('modalTitle').textContent = id ? 'Modifica Maglia' : 'Aggiungi Maglia';
    document.getElementById('fCategory').value = j?.category || 'nazionali';
    document.getElementById('fSubCategory').value = j?.subCategory || '';
    toggleSubCategoryField(j?.category || 'nazionali');
    document.getElementById('fClub').value = j?.club || '';
    document.getElementById('fSeason').value = j?.season || '';
    document.getElementById('fName').value = j?.name || '';
    document.getElementById('fPrice').value = j?.price || '';
    document.getElementById('fBuyPrice').value = j?.buyPrice || '';
    document.getElementById('fCondition').value = j?.condition || 'Mint / BNWT';
    document.getElementById('fStatus').value = j?.status || 'available';
    document.getElementById('fImgFront').value = j?.imgFront || '';
    document.getElementById('fImgBack').value = j?.imgBack || '';
    document.getElementById('fNotes').value = j?.notes || '';
    document.getElementById('fCustomName').value = j?.customName || '';
    document.getElementById('fCustomNumber').value = j?.customNumber || '';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function openEdit(id) { openModal(id); }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId = null; }
  function closeModalOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
  function toggleSubCategoryField(val) { document.getElementById('subCategoryField').style.display = val === 'nazionali' ? '' : 'none'; }

  function saveJersey() {
    const data = {
      category: document.getElementById('fCategory').value,
      subCategory: document.getElementById('fSubCategory').value,
      club: document.getElementById('fClub').value.trim(),
      season: document.getElementById('fSeason').value.trim(),
      name: document.getElementById('fName').value.trim(),
      size: 'S/M/L/XL/XXL',
      price: parseFloat(document.getElementById('fPrice').value) || 0,
      buyPrice: parseFloat(document.getElementById('fBuyPrice').value) || 0,
      condition: document.getElementById('fCondition').value,
      status: document.getElementById('fStatus').value,
      imgFront: document.getElementById('fImgFront').value.trim(),
      imgBack: document.getElementById('fImgBack').value.trim(),
      notes: document.getElementById('fNotes').value.trim(),
      customName: document.getElementById('fCustomName').value.trim(),
      customNumber: document.getElementById('fCustomNumber').value.trim(),
    };
    if (!data.name) { showToast('Inserisci il nome della maglia'); return; }
    if (editingId) {
      const idx = jerseys.findIndex(j=>j.id===editingId);
      jerseys[idx] = { ...jerseys[idx], ...data };
      showToast('Maglia aggiornata ✓');
    } else {
      jerseys.unshift({ id: nextId(), ...data });
      showToast('Maglia aggiunta ✓');
    }
    save(); closeModal(); renderTable();
  }

  function deleteJersey(id) {
    if (!confirm('Eliminare questa maglia?')) return;
    jerseys = jerseys.filter(j=>j.id!==id);
    save(); renderTable(); showToast('Maglia eliminata');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  renderTable();
</script>
</body>
</html>
